name: News aktualisieren

on:
  schedule:
    # Cron kennt keine Zeitzonen und keine Sommerzeit. Das Fenster ist hier
    # deshalb großzügig in UTC gesetzt (deckt MEZ und MESZ ab); ob wirklich
    # gebaut wird, entscheidet build-news.mjs anhand der echten Wiener Zeit.
    # Gewünscht: stündlich 5:30 bis 23:00, nachts Ruhe.
    - cron: '34 3-22 * * *'
  workflow_dispatch:        # Manuell im Actions-Tab auslösbar
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/**'
      - '!docs/data/**'      # sonst löst der Bot-Commit sich selbst wieder aus
      - '.github/workflows/update-news.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Feeds holen und news.json bauen
        run: node scripts/build-news.mjs
        env:
          # Optional. Ist das Repository-Secret ANTHROPIC_API_KEY gesetzt,
          # übersetzt Claude genau die Texte, an denen der kostenlose Dienst
          # gescheitert ist. Ohne Secret bleibt der Wert leer und der
          # Rückfall ist schlicht inaktiv — der Build läuft trotzdem durch.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Änderung committen
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"

          # Zwischen Checkout und Push können Minuten liegen. Landet in dieser
          # Zeit ein anderer Push, lehnt GitHub ab. Deshalb bis zu fünf
          # Versuche: bei Ablehnung den neuen Remote-Stand holen, den Zweig
          # darauf setzen und die frisch gebauten Daten erneut committen.
          # Die Daten dieses Laufs gewinnen immer — sie sind die aktuelleren.
          for versuch in 1 2 3 4 5; do
            # Der i18n-Cache MUSS mit, sonst übersetzt jeder Lauf alles neu.
            git add docs/data/news.json docs/data/i18n-cache.json
            if git diff --staged --quiet; then
              echo "Keine Änderung — nichts zu committen."
              exit 0
            fi
            git commit -q -m "News: $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push -q 2>/dev/null; then
              echo "Gepusht im Versuch $versuch."
              exit 0
            fi
            echo "Push abgelehnt (Versuch $versuch) — Remote hat sich bewegt, hole nach."
            git fetch -q origin main
            # Zeiger auf den neuen Remote-Stand, Arbeitsverzeichnis behalten:
            # die eben gebauten Dateien bleiben liegen und werden neu committet.
            git reset -q --mixed origin/main
            sleep $((versuch * 3))
          done
          echo "::error::Push nach 5 Versuchen fehlgeschlagen."
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
